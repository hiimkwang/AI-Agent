# AI-Agent - external config for this server.
#
# Loaded by install.sh via -Dspring.config.additional-location, on top of the
# properties packaged in the jar.
#
# VALUES STILL COME FROM config/aiagent.env. Every line below forwards an
# environment variable, exactly as the jar does. Do NOT replace ${VAR} with a
# literal: that kills the placeholder and the variable in aiagent.env stops
# having any effect. That trap already cost us once with RAG_EMBEDDING_DIM.
#
# This file exists to show, in one place, which keys this deployment cares
# about. Adding a key here is only necessary when the jar has no environment
# variable for it.
#
# Secrets are never written here - they live in config/aiagent.env, mode 600.

# ---------------------------------------------------------------- Web
server.port=${SERVER_PORT:8080}
# 0.0.0.0 = internal web UI reachable at http://10.21.170.55:8080.
# 127.0.0.1 once all traffic arrives through the Apache proxy.
server.address=${SERVER_ADDRESS:0.0.0.0}
# NATIVE is required behind Apache, otherwise redirect_uri is http:// and
# Microsoft returns AADSTS50011.
server.forward-headers-strategy=${FORWARD_HEADERS:NATIVE}
# Apache mounts the app under this prefix on chatbot-uat.bsc.com.vn.
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

# ---------------------------------------------------------- DataSource
# POSTGRES_PASSWORD is the fallback so one variable configures both the
# Postgres container and this application.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/rag_db}
spring.datasource.username=${DB_USERNAME:rag}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

# ------------------------------------------------------------ Embedding
# Decide before the first start: the width goes into the Flyway DDL, and
# changing it later means recreating the schema and re-ingesting everything.
# SchemaValidator refuses to start on a mismatch.
rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:OPENAI}
rag.embedding.dimensions=${RAG_EMBEDDING_DIM:1536}
rag.embedding.openai-model=${RAG_EMBEDDING_OPENAI_MODEL:text-embedding-3-small}

# ------------------------------------------------------------------ LLM
rag.llm.default-provider=${RAG_LLM_PROVIDER:OPENAI}
rag.llm.default-model=${RAG_LLM_MODEL:gpt-4o-mini}
rag.internal.provider=${RAG_INTERNAL_PROVIDER:OPENAI}
rag.internal.model=${RAG_INTERNAL_MODEL:gpt-4o-mini}
rag.rerank.provider=${RAG_RERANK_PROVIDER:LLM}

# ------------------------------------------------------------ Ingestion
# The only directory /admin/ingest-folder may read. Empty blocks it entirely.
rag.ingestion.allowed-roots=${RAG_ALLOWED_ROOTS:/app/aiagent/work/tai-lieu}

# ------------------------------------------------------------- Security
rag.security.allow-anonymous=${RAG_ALLOW_ANONYMOUS:false}
# Toggled from aiagent.env once the app registrations exist.
rag.entra.enabled=${ENTRA_ENABLED:false}
rag.bot.enabled=${BOT_ENABLED:false}
rag.teams.enabled=${RAG_TEAMS_ENABLED:false}

# ----------------------------------------------------------- Audit trail
rag.audit.enabled=${RAG_AUDIT_ENABLED:true}
# Only true because Apache really is in front; otherwise anyone can forge
# X-Forwarded-For and corrupt the audit trail.
rag.audit.trust-forwarded-for=${RAG_TRUST_PROXY:true}

# --------------------------------------------------------------- Privacy
rag.observability.log-questions=${RAG_LOG_QUESTIONS:false}
rag.observability.log-answers=${RAG_LOG_ANSWERS:false}

# ------------------------------------------------------------------- OCR
# One vision-model call per page. Measure the share of scanned PDFs first.
rag.ocr.enabled=${RAG_OCR_ENABLED:false}
rag.ocr.max-pages=${RAG_OCR_MAX_PAGES:60}

# -------------------------------------------------------- Virus scanning
# fail-closed: clamd unreachable means ingestion is refused.
rag.antivirus.enabled=${RAG_AV_ENABLED:false}

logging.level.com.ai.aiagent=${LOG_LEVEL:INFO}
