services:
  postgres:
    # Image pgvector chinh thuc, dua tren Postgres 17.
    # Da co san extension vector; unaccent va pg_trgm nam trong contrib cua Postgres.
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      # Collation phu hop tieng Viet
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - "postgres"
      # HNSW can maintenance_work_mem kha lon khi build index
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=100"

volumes:
  rag_pgdata:
