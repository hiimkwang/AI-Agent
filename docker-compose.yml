services:
  postgres:
    # Official pgvector image: ships the vector extension; unaccent and pg_trgm
    # come from Postgres contrib.
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - "postgres"
      # HNSW index builds need a large maintenance_work_mem.
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=100"

  # In the "app" profile, so `docker compose up -d` still starts Postgres only
  # and the dev loop (./mvnw spring-boot:run) is unaffected.
  #   docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: rag-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Inside the compose network the database host is the service name.
      DB_URL: jdbc:postgresql://postgres:5432/rag_db
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
      RAG_USER_API_KEY: ${RAG_USER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      ENTRA_ENABLED: ${ENTRA_ENABLED:-false}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      BOT_APP_ID: ${BOT_APP_ID:-}
      BOT_APP_PASSWORD: ${BOT_APP_PASSWORD:-}
      # Required behind a reverse proxy, otherwise redirect_uri is http:// and
      # Microsoft returns AADSTS50011.
      SERVER_FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS:-NATIVE}
      RAG_TRUST_PROXY: ${RAG_TRUST_PROXY:-true}
    volumes:
      - rag_logs:/app/logs
      # Read-only: the app never writes to the source document store.
      - ${RAG_DOCS_DIR:-./docs}:/data/docs:ro

volumes:
  rag_pgdata:
  rag_logs:
