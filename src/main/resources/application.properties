spring.application.name=AIAgent

# ---------------------------------------------------------------- Web
# FORWARD_HEADERS must be NATIVE behind a reverse proxy, otherwise Spring builds
# an http:// redirect_uri and Microsoft returns AADSTS50011. Default NONE so a
# direct run cannot be influenced by headers set by someone else.
server.port=${SERVER_PORT:8080}
# 0.0.0.0 for an internally reachable web UI; 127.0.0.1 once traffic arrives
# only through the reverse proxy.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=${FORWARD_HEADERS:NONE}
# Empty = served at the root. Set when Apache mounts the app under a prefix;
# the value must match the ProxyPass path on both sides.
server.servlet.context-path=${SERVER_CONTEXT_PATH:}
# Tomcat must not close the connection mid SSE stream.
server.tomcat.connection-timeout=120s
spring.mvc.async.request-timeout=300000
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ---------------------------------------------------------- DataSource
# Password is never hardcoded. POSTGRES_PASSWORD is the fallback so one variable
# can configure both the Postgres container and this app from a single env file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rag_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:16}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=rag-pool

# ------------------------------------------------------------- Flyway
# baseline-version=0 so V1 still runs on an older database that already has
# rag_chunks. The vector width reaches the DDL through the embeddingDim
# placeholder, so switching model means recreating the schema, not editing SQL.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.embeddingDim=${rag.embedding.dimensions}

# ---------------------------------------------------------- Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=AIAgent

# ---------------------------------------------------------- Security
# One API key per client, with roles and departments. An empty key disables that
# client. With no key configured and allow-anonymous=true every request is treated
# as ADMIN - development only, and it logs a warning on every startup.
rag.security.enabled=true
rag.security.allow-anonymous=${RAG_ALLOW_ANONYMOUS:false}
rag.security.header-name=X-API-Key

rag.security.clients[0].id=admin
rag.security.clients[0].key=${RAG_ADMIN_API_KEY:}
rag.security.clients[0].roles=ADMIN,USER
rag.security.clients[0].departments=*

rag.security.clients[1].id=staff
rag.security.clients[1].key=${RAG_USER_API_KEY:}
rag.security.clients[1].roles=USER
rag.security.clients[1].departments=*

# ------------------------------------------------- Microsoft Entra ID
# Off by default. On, the web UI switches to Entra sign-in while API keys keep
# working for machine callers. Enabled without tenant/client id => startup fails.
# Redirect URI: https://<host>/login/oauth2/code/entra
rag.entra.enabled=${ENTRA_ENABLED:false}
rag.entra.registration-id=entra
rag.entra.tenant-id=${ENTRA_TENANT_ID:}
rag.entra.client-id=${ENTRA_CLIENT_ID:}
rag.entra.client-secret=${ENTRA_CLIENT_SECRET:}
# Second guard after a SingleTenant app registration. Comma separated.
rag.entra.allowed-email-domains=${ENTRA_ALLOWED_DOMAINS:bsc.com.vn}
rag.entra.default-roles=USER
rag.entra.role-mappings.RagAdmin=ADMIN,USER
rag.entra.role-mappings.RagEditor=USER
rag.entra.role-mappings.RagUser=USER
# Alternative to app roles: members of these group object ids are ADMIN.
rag.entra.admin-groups=${ENTRA_ADMIN_GROUPS:}
# Bootstrap backdoor. Clear once app roles are assigned.
rag.entra.bootstrap-admin-upns=${ENTRA_BOOTSTRAP_ADMINS:}
# Group to department mapping uses bracket syntax because object ids contain
# dashes: rag.entra.group-departments[8f4e1c2a-...]=nhan-su,ke-toan
# No group match and not ADMIN => reads nothing. Set * to open everything.
rag.entra.fallback-departments=${ENTRA_FALLBACK_DEPARTMENTS:}
# App-only Graph for groups and profile. Needs admin consent for
# User.Read.All + GroupMember.Read.All.
rag.entra.graph-enabled=${ENTRA_GRAPH_ENABLED:true}
# Too short throttles Graph, too long keeps stale permissions after a transfer.
rag.entra.group-cache-minutes=15
rag.entra.graph-timeout-seconds=10

rag.security.rate-limit.enabled=true
rag.security.rate-limit.chat-per-minute=30
rag.security.rate-limit.admin-per-minute=120
rag.security.rate-limit.webhook-per-minute=60
# Lenh doc nhe cua giao dien (/me, /settings, /models, /categories, /conversations).
# Mot lan tai trang la ~5 request nen han muc nay phai thoang han chat-per-minute.
rag.security.rate-limit.other-per-minute=300
rag.security.max-question-length=4000

# ------------------------------------------ Teams outgoing webhook (legacy)
# Works only in the team that created the webhook, only on @mention, and carries
# no user identity, so it cannot enforce per-user permissions. Use rag.bot.* instead.
rag.teams.enabled=${RAG_TEAMS_ENABLED:false}
rag.teams.hmac-secret=${TEAMS_HMAC_SECRET:}
rag.teams.max-clock-skew-seconds=300

# -------------------------------------------------------- Teams bot
# Messaging endpoint declared on the Azure Bot resource: https://<host>/api/messages
# app-type: MULTI_TENANT (Azure Bot default) | SINGLE_TENANT (needs tenant-id).
rag.bot.enabled=${BOT_ENABLED:false}
rag.bot.app-id=${BOT_APP_ID:}
rag.bot.app-password=${BOT_APP_PASSWORD:}
rag.bot.app-type=${BOT_APP_TYPE:MULTI_TENANT}
rag.bot.tenant-id=${BOT_TENANT_ID:${ENTRA_TENANT_ID:}}
# Which bot serves which team and which collections is configured in the admin
# UI and stored in the database, not here.
# Scope used when the user cannot be identified. Empty = deny. Set * for the old
# outgoing-webhook behaviour.
rag.bot.unidentified-departments=${BOT_UNIDENTIFIED_DEPARTMENTS:}
rag.bot.worker-threads=8
rag.bot.per-user-per-minute=12
# Per-bot ceiling so one abused bot cannot exhaust the system. 0 disables.
rag.bot.per-bot-per-minute=${BOT_PER_BOT_PER_MINUTE:120}
rag.bot.max-citations=4
rag.bot.connector-timeout-seconds=20

# Only directories listed here can be ingested from the server. Comma separated.
rag.ingestion.allowed-roots=${RAG_ALLOWED_ROOTS:}

# ------------------------------------------------------------------ LLM
# Providers: OPENAI | ANTHROPIC | GEMINI | OLLAMA
rag.llm.default-provider=${RAG_LLM_PROVIDER:OPENAI}
rag.llm.default-model=${RAG_LLM_MODEL:gpt-4o-mini}
# temperature=0 for citation-bound answering.
rag.llm.temperature=0.0
rag.llm.max-output-tokens=2048
rag.llm.timeout-seconds=120

# ------------------------------------------------------------ Embedding
# OPENAI - text-embedding-3-small, 1536 dims.
# OLLAMA - local, e.g. bge-m3 (1024 dims), strong for Vietnamese.
# LOCAL  - all-MiniLM-L6-v2 in-process (ONNX), 384 dims, no key and no network,
#          but weak on Vietnamese - pipeline testing or fallback only.
# dimensions must match both the model and the database schema. Changing the
# model or the width requires re-ingesting every document.
rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:OPENAI}
rag.embedding.dimensions=${RAG_EMBEDDING_DIM:1536}
rag.embedding.openai-model=${RAG_EMBEDDING_OPENAI_MODEL:text-embedding-3-small}
rag.embedding.ollama-model=${RAG_EMBEDDING_OLLAMA_MODEL:bge-m3}

# Trial embedding: re-embeds existing chunks into a side table and compares
# recall@k / MRR against the live index, so the switch is a measured decision.
#   1) enable and set the candidate provider/model/dimensions
#   2) POST /api/v1/rag/admin/embedding-trial/build?rebuild=true
#   3) POST /api/v1/rag/admin/embedding-trial/compare
#   4) better => switch for real (docs/EMBEDDING-UPGRADE.md); otherwise DELETE
rag.embedding.trial.enabled=${RAG_EMBEDDING_TRIAL:false}
rag.embedding.trial.provider=${RAG_EMBEDDING_TRIAL_PROVIDER:OPENAI}
rag.embedding.trial.openai-model=${RAG_EMBEDDING_TRIAL_MODEL:text-embedding-3-large}
rag.embedding.trial.ollama-model=bge-m3
rag.embedding.trial.dimensions=${RAG_EMBEDDING_TRIAL_DIM:3072}
rag.embedding.trial.table=rag_chunks_trial
rag.embedding.trial.batch-size=64

rag.openai.api-key=${OPENAI_API_KEY:}
rag.openai.base-url=${OPENAI_BASE_URL:}
rag.openai.chat-model=gpt-4o-mini

# Thinking off and low effort: this is grounded Q&A, not multi-step reasoning.
rag.anthropic.api-key=${ANTHROPIC_API_KEY:}
rag.anthropic.chat-model=claude-opus-5
rag.anthropic.thinking-enabled=false
rag.anthropic.effort=low

rag.gemini.api-key=${GEMINI_API_KEY:}
rag.gemini.chat-model=gemini-2.0-flash

rag.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rag.ollama.chat-model=qwen2.5:7b

# Cheap model for internal steps: rewrite, HyDE, context, rerank, judge.
rag.internal.provider=${RAG_INTERNAL_PROVIDER:OPENAI}
rag.internal.model=${RAG_INTERNAL_MODEL:gpt-4o-mini}

# ---------------------------------------------------------- Vector store
rag.store.chunk-table=rag_chunks
rag.store.insert-batch-size=500

# ------------------------------------------------------------- Retrieval
rag.retrieval.hybrid-enabled=true
rag.retrieval.vector-top-k=24
rag.retrieval.fulltext-top-k=24
rag.retrieval.rrf-k=60
rag.retrieval.candidates=36
rag.retrieval.top-k=6
# pgvector filters after the HNSW walk, so category/ACL queries must over-fetch
# and be trimmed in Java.
rag.retrieval.filter-overfetch-multiplier=4
rag.retrieval.max-overfetch=400
rag.retrieval.recency-boost-enabled=true
rag.retrieval.recency-boost-weight=0.15
rag.retrieval.exclude-expired=true
# Retrieve with the original question and its rewrites (+ HyDE), merged by RRF.
rag.retrieval.multi-query-enabled=true
rag.retrieval.hyde-enabled=false
# Glossary expansion adds a variant, it does not replace the original query.
# Needed in this domain: users type "UBCK"/"CTCK" while documents spell it out,
# so neither vector nor full-text would match.
rag.retrieval.glossary-enabled=true
# Below these scores the system answers "not found" instead of guessing.
rag.retrieval.min-rerank-score=0.30
rag.retrieval.min-vector-score=0.20
rag.retrieval.abstain-when-below-threshold=true

# ---------------------------------------------------------------- Rerank
# Providers: LLM | COHERE | NONE
rag.rerank.provider=${RAG_RERANK_PROVIDER:LLM}
rag.cohere.api-key=${COHERE_API_KEY:}
rag.cohere.rerank-model=rerank-multilingual-v3.0

rag.query-rewrite.enabled=true
rag.query-rewrite.max-history-turns=6
rag.query-rewrite.max-history-chars=3000

# ------------------------------------------------- Document conversion
# Every file type is converted to Markdown before chunking; tables are kept as
# Markdown tables.
rag.convert.pdf-enabled=true
rag.convert.html-enabled=true
rag.convert.office-enabled=true
# Store the Markdown so re-chunking does not require converting again.
rag.convert.store-markdown=true
rag.convert.pdf-drop-repeated-lines=true
rag.convert.max-markdown-chars=4000000

# -------------------------------------------------------------- Chunking
# Splits on Markdown heading structure, not on character count.
rag.chunking.strategy=MARKDOWN_HEADING
rag.chunking.parent-max-chars=2400
rag.chunking.child-max-chars=600
rag.chunking.child-overlap-chars=120
rag.chunking.min-section-chars=200
rag.chunking.prefix-heading-path=true
rag.chunking.dedupe-within-document=true
# Recognises Phan/Chuong/Muc/Dieu/Phu luc as structure even when the document has
# no Markdown headings at all, which is the norm for PDF and Word conversions.
rag.chunking.legal-structure-enabled=true
# Prefixes document name, number and effective date onto embedded text; without
# it, questions like "which decision number" almost always miss.
# Changing this requires re-ingesting.
rag.chunking.prefix-document-identity=true

# Contextual retrieval: one LLM call per chunk at ingest time.
rag.ingestion.contextual-enabled=false
rag.ingestion.contextual-concurrency=8
rag.ingestion.embed-batch-size=96
rag.ingestion.embed-max-retries=4
rag.ingestion.embed-retry-base-delay-ms=800
rag.ingestion.job-concurrency=2
rag.ingestion.skip-unchanged=true

# ----------------------------------------------------------- Answer cache
rag.cache.enabled=true
rag.cache.ttl-minutes=180
rag.cache.max-entries=5000
rag.cache.semantic-enabled=true
rag.cache.semantic-threshold=0.97

# ------------------------------------------------------------------ Chat
# Wording and prompt, all editable at runtime through POST /api/v1/rag/settings
# (keys chat.systemPrompt, chat.notFoundMessage, chat.notRelevantMessage,
# chat.smallTalk*) so changing tone does not need a rebuild.
#
# EMPTY MEANS "use the default shipped in the jar", not "empty text". That is
# deliberate for systemPrompt: a blank one would drop the document-only rule and
# the prompt-injection boundary, and the model would start answering from its own
# knowledge with no visible sign anything changed.
rag.chat.citations-enabled=true
rag.chat.system-prompt=${RAG_SYSTEM_PROMPT:}
rag.chat.not-found-message=${RAG_NOT_FOUND_MESSAGE:}
rag.chat.not-relevant-message=${RAG_NOT_RELEVANT_MESSAGE:}
# Greetings match no document, so without this they get answered with
# "khong tim thay tai lieu" - see SmallTalkDetector.
rag.chat.small-talk-enabled=${RAG_SMALL_TALK_ENABLED:true}
rag.chat.small-talk-pattern=${RAG_SMALL_TALK_PATTERN:}
rag.chat.small-talk-reply=${RAG_SMALL_TALK_REPLY:}

# --------------------------------------------------------------- Privacy
# Turning these on puts user questions and answers into the log files.
rag.observability.log-questions=${RAG_LOG_QUESTIONS:false}
rag.observability.log-answers=${RAG_LOG_ANSWERS:false}
rag.observability.log-candidates=false

# ------------------------------------------------- Delegated administration
# rag_grants lets an admin hand one collection (and its bot) to a department
# person without making them a system admin. Enforced in DelegationService and
# reachable only under /api/v1/rag/my/**.
rag.grants.enabled=${RAG_GRANTS_ENABLED:true}
# A delegated owner may only share a collection with groups they belong to. That
# still lets them pick a company-wide group and publish everything in one click,
# so list the object ids of groups too broad to ever be a read permission.
rag.grants.acl-denied-groups=${RAG_GRANTS_ACL_DENIED_GROUPS:}
rag.grants.owners-may-edit-persona=${RAG_GRANTS_OWNERS_MAY_EDIT_PERSONA:true}

# ----------------------------------------------------------- Audit trail
# Records every data or config changing request under /admin, /settings and
# /eval, including denied ones (401/403). See AuditFilter.
rag.audit.enabled=${RAG_AUDIT_ENABLED:true}
# Reads outnumber writes by orders of magnitude and drown the entries that matter.
rag.audit.include-read=${RAG_AUDIT_INCLUDE_READ:false}
rag.audit.max-payload-chars=2000
# Only enable behind a real reverse proxy, otherwise anyone can forge
# X-Forwarded-For and corrupt the audit trail.
rag.audit.trust-forwarded-for=${RAG_TRUST_PROXY:false}

# -------------------------------------------------------- Data retention
# Runs daily. A value <= 0 keeps that category forever.
rag.retention.enabled=${RAG_RETENTION_ENABLED:true}
rag.retention.run-at-hour=2
rag.retention.conversation-days=${RAG_RETENTION_CONVERSATION_DAYS:180}
# Audit entries outlive conversations: they exist for accountability.
rag.retention.audit-days=${RAG_RETENTION_AUDIT_DAYS:730}
rag.retention.job-days=90

# ------------------------------------------------------------------- OCR
# Off by default: one vision-model call per page, so ingesting a whole library
# is a real cost. Always review the resulting Markdown.
rag.ocr.enabled=${RAG_OCR_ENABLED:false}
rag.ocr.provider=${RAG_OCR_PROVIDER:OPENAI}
rag.ocr.model=${RAG_OCR_MODEL:gpt-4o-mini}
rag.ocr.dpi=150
# Hard stop so an 800 page scan cannot burn the API quota.
rag.ocr.max-pages=${RAG_OCR_MAX_PAGES:60}
rag.ocr.concurrency=4
rag.ocr.timeout-seconds=120
# Also OCR when a PDF has text but very little of it, per page. 0 = only when
# there is no text at all.
rag.ocr.min-chars-per-page=80

# -------------------------------------------------------- Virus scanning
# clamd INSTREAM. Off by default so development needs no ClamAV; enable in
# production. fail-closed: if clamd is unreachable the file is refused.
rag.antivirus.enabled=${RAG_AV_ENABLED:false}
rag.antivirus.host=${RAG_AV_HOST:127.0.0.1}
rag.antivirus.port=${RAG_AV_PORT:3310}
rag.antivirus.timeout-seconds=30
rag.antivirus.fail-closed=true

logging.level.com.ai.aiagent=${LOG_LEVEL:INFO}
