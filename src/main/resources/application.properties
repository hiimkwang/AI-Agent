spring.application.name=AIAgent

server.port=${SERVER_PORT:8080}
# SSE streaming: khong duoc de Tomcat dong ket noi giua luc dang stream
server.tomcat.connection-timeout=120s
spring.mvc.async.request-timeout=300000

# Cho phep upload file lon
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ============================================================
# DataSource
# Mat khau KHONG hardcode: dat qua bien moi truong DB_PASSWORD.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rag_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:16}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=rag-pool

# ============================================================
# Flyway - quan ly schema
# baseline-version=0 de migration V1 VAN CHAY tren DB cu da co rag_chunks.
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# So chieu vector duoc truyen vao migration -> doi model embedding chi can doi
# rag.embedding.dimensions roi tao lai schema, khong sua tay file .sql
spring.flyway.placeholders.embeddingDim=${rag.embedding.dimensions}

# ============================================================
# Actuator - health / metrics / prometheus
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=AIAgent

# ============================================================
# BAO MAT
# Moi client la 1 API key + danh sach role + danh sach phong ban.
# Key rong => client do bi bo qua. Neu KHONG co key nao duoc cau hinh va
# rag.security.allow-anonymous=true thi moi request duoc coi la ADMIN
# (chi dung cho may dev - se ghi log canh bao moi lan khoi dong).
# ============================================================
rag.security.enabled=true
rag.security.allow-anonymous=${RAG_ALLOW_ANONYMOUS:false}
rag.security.header-name=X-API-Key

rag.security.clients[0].id=admin
rag.security.clients[0].key=${RAG_ADMIN_API_KEY:}
rag.security.clients[0].roles=ADMIN,USER
rag.security.clients[0].departments=*

rag.security.clients[1].id=staff
rag.security.clients[1].key=${RAG_USER_API_KEY:}
rag.security.clients[1].roles=USER
rag.security.clients[1].departments=*

# ============================================================
# DANG NHAP BANG TAI KHOAN CONG TY (Microsoft Entra ID)
#
# MAC DINH TAT. Tat => he thong xac thuc y nhu truoc, chi bang API key.
# Bat => giao dien web chuyen sang dang nhap Entra, con API key VAN GIU NGUYEN
# cho may goi may (webhook Teams, script, tac vu nen).
#
# Bat len can 3 bien: ENTRA_ENABLED=true, ENTRA_TENANT_ID, ENTRA_CLIENT_ID,
# ENTRA_CLIENT_SECRET. Thieu tenant/client id thi ung dung TU CHOI KHOI DONG
# (bao loi ro), khong am tham chay tiep bang API key.
#
# Redirect URI phai khai trong app registration:
#   https://<host>/login/oauth2/code/entra
# ============================================================
rag.entra.enabled=${ENTRA_ENABLED:false}
rag.entra.registration-id=entra
rag.entra.tenant-id=${ENTRA_TENANT_ID:}
rag.entra.client-id=${ENTRA_CLIENT_ID:}
rag.entra.client-secret=${ENTRA_CLIENT_SECRET:}

# Dai an toan THU HAI sau app registration SingleTenant. Nhieu mien: cach nhau dau ,
rag.entra.allowed-email-domains=${ENTRA_ALLOWED_DOMAINS:bsc.com.vn}

# App role khai trong app registration -> role noi bo.
# Chua gan app role nao thi nguoi dang nhap chi co default-roles.
rag.entra.default-roles=USER
rag.entra.role-mappings.RagAdmin=ADMIN,USER
rag.entra.role-mappings.RagEditor=USER
rag.entra.role-mappings.RagUser=USER

# Duong THAY THE app role: thanh vien cac nhom Entra nay la ADMIN (objectId, cach nhau dau ,)
rag.entra.admin-groups=${ENTRA_ADMIN_GROUPS:}

# CUA HAU KHOI DONG - pha vong "muon cau hinh phai vao admin, muon vao admin phai
# co app role, ma app role lai do IT gan". XOA sau khi da gan app role xong.
rag.entra.bootstrap-admin-upns=${ENTRA_BOOTSTRAP_ADMINS:}

# Nhom Entra -> phong ban duoc doc. objectId co dau gach ngang nen PHAI dung ngoac vuong:
#   rag.entra.group-departments[8f4e1c2a-....]=nhan-su,ke-toan
# Nguoi khong khop nhom nao va khong phai ADMIN => khong doc duoc tai lieu nao.
# Dat fallback-departments=* de mo toan bo trong giai doan chay thu.
rag.entra.fallback-departments=${ENTRA_FALLBACK_DEPARTMENTS:}

# Graph app-only de lay nhom + ho so. Can admin consent User.Read.All + GroupMember.Read.All.
rag.entra.graph-enabled=${ENTRA_GRAPH_ENABLED:true}
# Cache thanh vien nhom. Ngan qua thi Graph bi throttle, dai qua thi nguoi chuyen
# phong giu quyen cu lau.
rag.entra.group-cache-minutes=15
rag.entra.graph-timeout-seconds=10

# Rate limit (token bucket theo client + theo IP cho webhook)
rag.security.rate-limit.enabled=true
rag.security.rate-limit.chat-per-minute=30
rag.security.rate-limit.admin-per-minute=120
rag.security.rate-limit.webhook-per-minute=60
rag.security.max-question-length=4000

# ============================================================
# Teams - Outgoing Webhook (CU, chi nen dung de thu nghiem)
#
# Han che khong the vuot qua: chi chay trong dung team da tao webhook, chi khi bi
# @mention trong channel, KHONG co danh tinh nguoi dung (payload khong co aadObjectId)
# nen khong the phan quyen theo nguoi. Dung rag.bot.* ben duoi cho ban that.
# ============================================================
rag.teams.enabled=${RAG_TEAMS_ENABLED:false}
rag.teams.hmac-secret=${TEAMS_HMAC_SECRET:}
rag.teams.max-clock-skew-seconds=300

# ============================================================
# BOT TEAMS THAT (Azure Bot Service + Bot Framework)
#
# Messaging endpoint khai trong Azure Bot resource: https://<host>/api/messages
# Mac dinh TAT. Xem docs/TEAMS-BOT-SETUP.md.
#
# app-type: MULTI_TENANT (mac dinh cua Azure Bot) | SINGLE_TENANT (can them tenant-id)
# ============================================================
rag.bot.enabled=${BOT_ENABLED:false}
rag.bot.app-id=${BOT_APP_ID:}
rag.bot.app-password=${BOT_APP_PASSWORD:}
rag.bot.app-type=${BOT_APP_TYPE:MULTI_TENANT}
rag.bot.tenant-id=${BOT_TENANT_ID:${ENTRA_TENANT_ID:}}

# --- Pham vi tra loi ---
# Bot nao phuc vu Team nao, tap tai lieu nao duoc tra loi trong channel: cau hinh o
# man QUAN TRI (tab "Bot & phan quyen"), luu trong DB - khong con o day.
#
# Pham vi khi KHONG xac dinh duoc nguoi dung (thieu aadObjectId hoac chua bat Entra).
# Rong = tu choi. Dat * de tro lai hanh vi cu cua Outgoing Webhook (ai cung doc moi thu).
rag.bot.unidentified-departments=${BOT_UNIDENTIFIED_DEPARTMENTS:}

# --- Van hanh ---
rag.bot.worker-threads=8
rag.bot.per-user-per-minute=12
# Tran theo BOT: mot bot bi lam dung khong duoc lam chet ca he thong. Dat 0 de tat.
rag.bot.per-bot-per-minute=${BOT_PER_BOT_PER_MINUTE:120}
rag.bot.max-citations=4
rag.bot.connector-timeout-seconds=20

# Thu muc DUY NHAT duoc phep nap tu may chu (chong doc file tuy y).
# Nhieu thu muc thi cach nhau bang dau ,
rag.ingestion.allowed-roots=${RAG_ALLOWED_ROOTS:}

# ============================================================
# LLM - provider hop le: OPENAI | ANTHROPIC | GEMINI | OLLAMA
# ============================================================
rag.llm.default-provider=${RAG_LLM_PROVIDER:OPENAI}
rag.llm.default-model=${RAG_LLM_MODEL:gpt-4o-mini}
# temperature=0 cho tac vu trich dan tai lieu
rag.llm.temperature=0.0
rag.llm.max-output-tokens=2048
rag.llm.timeout-seconds=120

# ============================================================
# EMBEDDING
# provider: OPENAI | OLLAMA | LOCAL
#   OPENAI  - text-embedding-3-small, 1536 chieu. Chat luong tot, can API key.
#   OLLAMA  - chay local, vd bge-m3 (1024 chieu) rat tot cho tieng Viet.
#   LOCAL   - all-MiniLM-L6-v2 chay TRONG TIEN TRINH (ONNX), 384 chieu, khong can
#             API key va khong can mang. CHAT LUONG TIENG VIET KEM - chi dung de
#             thu nghiem pipeline hoac lam duong du phong.
#
# dimensions PHAI khop model da chon, va khop schema DB.
# Doi model/so chieu => phai NAP LAI toan bo tai lieu.
# ============================================================
rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:OPENAI}
rag.embedding.dimensions=${RAG_EMBEDDING_DIM:1536}
rag.embedding.openai-model=${RAG_EMBEDDING_OPENAI_MODEL:text-embedding-3-small}
rag.embedding.ollama-model=${RAG_EMBEDDING_OLLAMA_MODEL:bge-m3}

# ------------------------------------------------------------
# THU MODEL EMBEDDING UNG VIEN (khong dong den index dang chay)
#
# Doi model embedding la thay doi dat gia nhat cua he thong: phai tao lai schema va nap
# lai TOAN BO tai lieu, sai thi lam lai lan nua. Co che nay nhung lai chinh cac chunk
# dang co bang model ung vien vao mot bang phu, roi do recall@k/MRR cua hai ben tren
# cung mot bo cau hoi - quyet dinh dua tren so lieu chu khong phai cam giac.
#
# Quy trinh:
#   1) bat trial.enabled=true, dat provider/model/dimensions cua ung vien
#   2) POST /api/v1/rag/admin/embedding-trial/build?rebuild=true
#   3) POST /api/v1/rag/admin/embedding-trial/compare
#   4) tot hon => doi that (xem docs/EMBEDDING-UPGRADE.md); khong => DELETE de xoa bang
# ------------------------------------------------------------
rag.embedding.trial.enabled=${RAG_EMBEDDING_TRIAL:false}
rag.embedding.trial.provider=${RAG_EMBEDDING_TRIAL_PROVIDER:OPENAI}
rag.embedding.trial.openai-model=${RAG_EMBEDDING_TRIAL_MODEL:text-embedding-3-large}
rag.embedding.trial.ollama-model=bge-m3
rag.embedding.trial.dimensions=${RAG_EMBEDDING_TRIAL_DIM:3072}
rag.embedding.trial.table=rag_chunks_trial
rag.embedding.trial.batch-size=64

# --- OpenAI (chat) ---
rag.openai.api-key=${OPENAI_API_KEY:}
rag.openai.base-url=${OPENAI_BASE_URL:}
rag.openai.chat-model=gpt-4o-mini

# --- Anthropic / Claude ---
rag.anthropic.api-key=${ANTHROPIC_API_KEY:}
rag.anthropic.chat-model=claude-opus-5
# Tat thinking + effort thap cho tac vu hoi-dap co ngu canh san:
# nhanh hon, re hon. Bat len khi can suy luan nhieu buoc.
rag.anthropic.thinking-enabled=false
rag.anthropic.effort=low

# --- Google Gemini ---
rag.gemini.api-key=${GEMINI_API_KEY:}
rag.gemini.chat-model=gemini-2.0-flash

# --- Ollama (local) ---
rag.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rag.ollama.chat-model=qwen2.5:7b

# Model "re" cho tac vu noi bo: rewrite, HyDE, sinh context, rerank, judge
rag.internal.provider=${RAG_INTERNAL_PROVIDER:OPENAI}
rag.internal.model=${RAG_INTERNAL_MODEL:gpt-4o-mini}

# ============================================================
# Vector store
# ============================================================
rag.store.chunk-table=rag_chunks
rag.store.insert-batch-size=500

# ============================================================
# RETRIEVAL
# ============================================================
rag.retrieval.hybrid-enabled=true
rag.retrieval.vector-top-k=24
rag.retrieval.fulltext-top-k=24
rag.retrieval.rrf-k=60
rag.retrieval.candidates=36
rag.retrieval.top-k=6
# Khi loc theo category/ACL, pgvector loc SAU khi duyet HNSW nen phai
# lay du ra roi cat lai - neu khong se thieu ket qua.
rag.retrieval.filter-overfetch-multiplier=4
rag.retrieval.max-overfetch=400
# Boost tai lieu con hieu luc / moi ban hanh
rag.retrieval.recency-boost-enabled=true
rag.retrieval.recency-boost-weight=0.15
rag.retrieval.exclude-expired=true

# Multi-query: truy xuat bang CA cau goc + cau viet lai (+ HyDE) roi gop RRF
rag.retrieval.multi-query-enabled=true
rag.retrieval.hyde-enabled=false
# Mo rong viet tat/thuat ngu (bang rag_synonyms) thanh MOT bien the truy van nua.
# Bat buoc voi nganh chung khoan: can bo go "UBCK"/"CTCK", tai lieu viet day du - hai
# chuoi khong chung mot tu nao nen ca vector lan full-text deu truot.
# Them bien the chu KHONG thay the cau goc, nen khong mat tu khoa nguoi dung da go.
rag.retrieval.glossary-enabled=true

# Nguong tu choi tra loi. Diem sau rerank duoi nguong => tra "khong tim thay".
rag.retrieval.min-rerank-score=0.30
rag.retrieval.min-vector-score=0.20
rag.retrieval.abstain-when-below-threshold=true

# ============================================================
# RERANK - provider: LLM | COHERE | NONE
# ============================================================
rag.rerank.provider=${RAG_RERANK_PROVIDER:LLM}
rag.cohere.api-key=${COHERE_API_KEY:}
rag.cohere.rerank-model=rerank-multilingual-v3.0

# ============================================================
# QUERY REWRITE
# ============================================================
rag.query-rewrite.enabled=true
rag.query-rewrite.max-history-turns=6
rag.query-rewrite.max-history-chars=3000

# ============================================================
# CHUYEN DOI TAI LIEU SANG MARKDOWN
# Toan bo file (pdf/html/docx/xlsx/pptx/txt) duoc chuyen sang Markdown
# TRUOC khi bam chunk. Bang bieu duoc giu nguyen dang bang Markdown.
# ============================================================
rag.convert.pdf-enabled=true
rag.convert.html-enabled=true
rag.convert.office-enabled=true
# Luu ban Markdown vao rag_documents.markdown de re-chunk khong can convert lai
rag.convert.store-markdown=true
# PDF: bo qua trang trang / header-footer lap lai
rag.convert.pdf-drop-repeated-lines=true
rag.convert.max-markdown-chars=4000000

# ============================================================
# CHUNKING - bam theo CAU TRUC heading cua Markdown
# ============================================================
rag.chunking.strategy=MARKDOWN_HEADING
rag.chunking.parent-max-chars=2400
rag.chunking.child-max-chars=600
rag.chunking.child-overlap-chars=120
# Section ngan hon nguong nay se duoc gop voi section ke tiep
rag.chunking.min-section-chars=200
# Luon gan duong dan heading vao dau chunk khi embed
rag.chunking.prefix-heading-path=true
# Bo qua chunk trung lap noi dung trong cung tai lieu
rag.chunking.dedupe-within-document=true
# Nhan dien Phan/Chuong/Muc/Dieu/Phu luc lam moc cau truc, ke ca khi tai lieu khong co
# heading Markdown nao (thuong gap voi file chuyen tu PDF/Word). Nho vay chunk khong bao
# gio bi cat ngang giua mot Dieu.
rag.chunking.legal-structure-enabled=true
# Gan ten tai lieu + so hieu + ngay hieu luc vao van ban DEM DI NHUNG. Khong co buoc nay,
# cau hoi dang "quy dinh so bao nhieu" gan nhu chac chan truot.
# DOI GIA TRI NAY => phai NAP LAI tai lieu thi moi co tac dung.
rag.chunking.prefix-document-identity=true

# Contextual Retrieval: LLM sinh 1-2 cau ngu canh cho tung chunk.
# Chinh xac hon nhung TON 1 loi goi LLM/chunk luc nap.
rag.ingestion.contextual-enabled=false
rag.ingestion.contextual-concurrency=8
rag.ingestion.embed-batch-size=96
rag.ingestion.embed-max-retries=4
rag.ingestion.embed-retry-base-delay-ms=800
rag.ingestion.job-concurrency=2
rag.ingestion.skip-unchanged=true

# ============================================================
# CACHE CAU TRA LOI
# ============================================================
rag.cache.enabled=true
rag.cache.ttl-minutes=180
rag.cache.max-entries=5000
rag.cache.semantic-enabled=true
rag.cache.semantic-threshold=0.97

# ============================================================
# LOG / QUYEN RIENG TU
# Tat log-questions neu khong muon cau hoi nguoi dung nam trong file log.
# ============================================================
rag.observability.log-questions=${RAG_LOG_QUESTIONS:false}
rag.observability.log-answers=${RAG_LOG_ANSWERS:false}
rag.observability.log-candidates=false

logging.level.com.ai.aiagent=INFO
