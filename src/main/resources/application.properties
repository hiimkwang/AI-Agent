spring.application.name=AIAgent

# Cho phep upload file lon
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# DataSource (JdbcTemplate dung cho Hybrid Search)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Cau hinh LLM - co the chon provider/model
# Provider hop le: OLLAMA | OPENAI | GEMINI
# ============================================================
rag.llm.default-provider=OPENAI
rag.llm.default-model=gpt-4o-mini

# --- Ollama (local) ---
rag.ollama.base-url=http://localhost:11434
rag.ollama.chat-model=qwen2.5:7b

# --- OpenAI (GPT + Embedding) ---
rag.openai.api-key=${OPENAI_API_KEY:}
rag.openai.chat-model=gpt-4o-mini
rag.openai.embedding-model=text-embedding-3-small
rag.openai.embedding-dimensions=1536

# --- Google Gemini ---
#rag.gemini.api-key=${GEMINI_API_KEY:}
rag.gemini.api-key=
rag.gemini.chat-model=gemini-1.5-flash

# Model dung cho cac tac vu noi bo (rewrite query, sinh context, judge eval)
rag.internal.provider=OPENAI
rag.internal.model=gpt-4o-mini

# ============================================================
# Cau hinh bang vector (custom schema)
# ============================================================
rag.store.table=rag_chunks

# ============================================================
# Cau hinh Retrieval - Hybrid Search + RRF
# ============================================================
# Bat/tat hybrid (false = chi dung vector search)
rag.retrieval.hybrid-enabled=true
# So ung vien lay tu moi nhanh (vector / full-text)
rag.retrieval.vector-top-k=20
rag.retrieval.fulltext-top-k=20
# Hang so RRF (Reciprocal Rank Fusion), thuong de 60
rag.retrieval.rrf-k=60
# So ung vien giu lai sau khi gop, truoc khi rerank (tang khi co nhieu tai lieu)
rag.retrieval.candidates=30
# So chunk cuoi cung dua vao context tra loi
rag.retrieval.top-k=5

# ============================================================
# Cau hinh Rerank
# Provider: LLM | COHERE
# ============================================================
rag.rerank.provider=LLM
rag.cohere.api-key=
rag.cohere.rerank-model=rerank-multilingual-v3.0

# ============================================================
# Cau hinh Chunking (Parent-Child)
# Tim kiem bang child chunk nho (chinh xac), tra ve parent lon (du ngu canh)
# ============================================================
rag.ingestion.parent-chunk-size=2000
rag.ingestion.parent-chunk-overlap=200
rag.ingestion.child-chunk-size=500
rag.ingestion.child-chunk-overlap=100

# Contextual Retrieval (Anthropic): nho LLM sinh 1 cau ngu canh cho moi chunk
# Tang do chinh xac nhung ton them loi goi LLM luc upload. Tat de tiet kiem.
rag.ingestion.contextual-enabled=false
# So luong goi LLM sinh context chay SONG SONG (chi co tac dung khi contextual-enabled=true)
rag.ingestion.contextual-concurrency=8

# ============================================================
# Cau hinh Query Rewriting (multi-turn)
# ============================================================
rag.query-rewrite.enabled=true
