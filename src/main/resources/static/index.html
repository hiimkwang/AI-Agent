<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trợ lý tài liệu nội bộ</title>
    <link rel="stylesheet" href="/app.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .shell { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
        @media (min-width: 62rem) { .shell { grid-template-columns: 16rem 1fr; } }

        /* -------------------------------------------------------- Sidebar */
        /* Cột phụ TỐI hơn, vùng đọc SÁNG hơn. Trước đây ngược lại: khung chat mang nền
           xám còn mọi thứ quanh nó trắng, nên chỗ cần đọc lại trông như một cái hố. */
        aside {
            display: none;
            border-right: 1px solid var(--rule);
            background: var(--bg);
            flex-direction: column;
            min-height: 0;
        }
        @media (min-width: 62rem) { aside { display: flex; } }
        aside .head {
            padding: .7rem .8rem;
            border-bottom: 1px solid var(--rule);
            display: flex; gap: .5rem; align-items: center;
        }
        aside .head span {
            font-size: .8rem; font-weight: 600; color: var(--muted); flex: 1;
        }
        #conv-list { overflow-y: auto; flex: 1; padding: .4rem; }
        /* Mục bo góc, cách nhau bằng khoảng trắng thay vì kẻ ngang: danh sách ngắn
           mà kẻ đủ đường thì trông như bảng dữ liệu chứ không như chỗ bấm được. */
        .conv {
            padding: .5rem .65rem;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex; flex-direction: column; gap: .1rem;
        }
        .conv + .conv { margin-top: .15rem; }
        .conv:hover { background: var(--surface-2); }
        .conv.active { background: var(--accent-soft); color: var(--accent-ink); }
        .conv b { font-weight: 600; font-size: .88rem; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
        .conv small { color: var(--faint); font-size: .74rem; }

        /* ----------------------------------------------------------- Main */
        main { display: flex; flex-direction: column; min-height: 0; min-width: 0;
               background: var(--surface); }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.6rem clamp(.8rem, 4vw, 2rem) .8rem;
            display: flex; flex-direction: column; gap: 1.6rem;
        }
        .msg { max-width: 46rem; width: 100%; margin: 0 auto; display: flex; gap: .8rem; align-items: flex-start; }
        .msg .avatar {
            flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .78rem; font-weight: 700; margin-top: .1rem;
        }
        .msg.bot .avatar { background: var(--accent-grad); color: #fff; }
        /* Giao diện tối lật màu accent thành teal SÁNG, nên chữ trắng trên nền accent
           gần như mất hút. Đổi sang mực sẫm, cùng cách button.primary đang xử lý. */
        :root[data-theme="dark"] .msg.bot .avatar,
        :root[data-theme="dark"] #welcome .mark,
        :root[data-theme="dark"] details.cite .num { color: #06201E; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .msg.bot .avatar,
            :root:not([data-theme="light"]) #welcome .mark,
            :root:not([data-theme="light"]) details.cite .num { color: #06201E; }
        }
        .msg.user .avatar { background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule); }
        .msg .content { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
        .msg.user { flex-direction: row-reverse; }
        .msg.user .content { align-items: flex-end; }
        .msg.user .bubble {
            background: var(--surface-2);
            border: 1px solid var(--rule);
            padding: .6rem .9rem;
            border-radius: var(--radius-lg);
            border-top-right-radius: .3rem;
            max-width: 34rem;
        }
        /* Câu trả lời KHÔNG đóng khung. Câu trả lời ở đây dài — nhiều đoạn, danh sách,
           đôi khi cả bảng — nhốt trong một cái bong bóng viền tròn thì đọc mệt và phí
           chiều ngang. Khung chỉ dành cho hai trường hợp cần nổi bật bên dưới. */
        .msg.bot .bubble {
            background: transparent; border: 0; box-shadow: none; padding: 0;
        }
        .msg.bot .bubble > *:first-child { margin-top: 0; }
        .msg.bot .bubble > *:last-child { margin-bottom: 0; }
        .msg.bot .bubble p { margin: .5rem 0; }
        .msg.bot .bubble h3, .msg.bot .bubble h4, .msg.bot .bubble h5 { margin: .8rem 0 .3rem; font-size: 1rem; }
        .msg.bot .bubble ul { margin: .4rem 0; padding-left: 1.2rem; }
        .msg.bot .bubble code {
            font-family: var(--mono); font-size: .86em;
            background: var(--sunk); padding: .1em .3em; border: 1px solid var(--rule);
        }
        .msg.bot .bubble table { margin: .5rem 0; }
        .msg.bot .bubble blockquote {
            margin: .5rem 0; padding-left: .8rem; border-left: 2px solid var(--rule-strong);
        }
        /* Cau tra loi "khong tim thay" duoc phan biet ro bang mat */
        .msg.abstained .bubble,
        .msg.clarifying .bubble {
            padding: .75rem .95rem;
            border-radius: var(--radius-lg);
        }
        .msg.abstained .bubble {
            background: var(--ochre-soft);
            border: 1px solid var(--ochre);
        }
        /* Hoi lai vi cau hoi mo ho: day la mot cau hoi cua tro ly, KHONG phai canh bao
           loi/khong tim thay, nen dung tong mau accent thay vi ochre. */
        .msg.clarifying .bubble {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
        }
        .msg.clarifying .avatar { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent); }

        /* ------------------------------------------------------ Màn hình chào
           Trước đây khung chat mở ra là một khoảng trống cao gần cả màn hình với đúng
           một bong bóng chữ ở góc trên — trông như trang bị lỗi. Người dùng mới cũng
           không biết hỏi được cái gì, vì họ không biết trong kho có tài liệu nào. */
        #welcome {
            max-width: 46rem; width: 100%; margin: auto;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 1rem 0 2rem;
        }
        #welcome .mark {
            width: 3rem; height: 3rem; border-radius: 50%;
            background: var(--accent-grad); color: #fff;
            display: grid; place-items: center; font-size: 1.3rem;
            box-shadow: 0 0 0 6px var(--accent-soft);
        }
        #welcome h1 { font-size: 1.5rem; margin: 1.1rem 0 .4rem; letter-spacing: -.015em; }
        #welcome .lede { color: var(--muted); margin: 0; max-width: 34rem; }
        #welcome .promises {
            display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; margin-top: 1rem;
        }
        #welcome .promises span {
            font-size: .8rem; color: var(--muted);
            border: 1px solid var(--rule); border-radius: var(--radius-pill);
            padding: .2rem .7rem; background: var(--surface);
        }
        #welcome .suggest-label {
            margin: 1.8rem 0 .6rem; font-size: .78rem; color: var(--faint);
        }
        #welcome .suggests { display: grid; gap: .5rem; width: 100%; }
        @media (min-width: 46rem) { #welcome .suggests { grid-template-columns: 1fr 1fr; } }
        #welcome .suggests button {
            text-align: left; border-radius: var(--radius);
            border: 1px solid var(--rule); background: var(--surface);
            padding: .6rem .8rem; font-size: .9rem; color: var(--fg);
            display: flex; align-items: flex-start; gap: .5rem; line-height: 1.4;
        }
        #welcome .suggests button:hover { border-color: var(--accent); background: var(--accent-soft); }
        #welcome .suggests button i {
            color: var(--accent); font-style: normal; flex: none;
        }

        .status-line {
            display: flex; align-items: center; gap: .5rem;
            color: var(--muted); font-size: .88rem;
        }
        .spinner {
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid var(--rule-strong); border-top-color: var(--accent);
            animation: spin .7s linear infinite; flex: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ------------------------------------------------------- Citations */
        .cites { margin-top: .8rem; display: flex; flex-direction: column; gap: .45rem; }
        .cites > .label {
            font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--faint);
        }
        .cites .pill-row { display: flex; flex-wrap: wrap; gap: .4rem; }
        details.cite {
            border: 1px solid var(--rule);
            background: var(--surface);
            border-radius: var(--radius-pill);
            flex: 0 1 auto;
            max-width: 100%;
            transition: box-shadow .15s ease, border-color .15s ease, border-radius .15s ease;
        }
        details.cite:hover { border-color: var(--accent); }
        details.cite[open] {
            flex-basis: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }
        details.cite > summary {
            padding: .3rem .75rem; cursor: pointer; display: flex; gap: .45rem;
            align-items: center; font-size: .82rem; list-style: none;
        }
        details.cite > summary::-webkit-details-marker { display: none; }
        details.cite .num {
            font-family: var(--mono); font-weight: 700; font-size: .68rem; color: #fff;
            background: var(--accent-grad);
            width: 1.2rem; height: 1.2rem; border-radius: 50%; flex: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        details.cite .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
        details.cite[open] .name { white-space: normal; max-width: none; }
        details.cite .arrow { color: var(--faint); font-size: .7rem; transition: transform .15s ease; }
        details.cite[open] .arrow { transform: rotate(90deg); }
        details.cite .snippet {
            padding: .1rem .9rem .7rem 2.15rem;
            font-size: .84rem; color: var(--muted); line-height: 1.5;
        }
        details.cite .path {
            padding: 0 .9rem .4rem 2.15rem;
            font-family: var(--mono); font-size: .72rem; color: var(--faint);
        }

        .meta {
            margin-top: .6rem; display: flex; gap: .4rem; flex-wrap: wrap;
            align-items: center; font-size: .8rem;
        }
        .meta .vote { display: flex; gap: .25rem; margin-left: auto; }

        /* --------------------------------------------------------- Composer
           Thứ tự bị đảo so với bản cũ: Ô NHẬP LÊN TRÊN, tuỳ chọn xuống dưới và thu nhỏ.
           Trước đây hai hộp chọn model/nhóm tài liệu nằm trên cùng, to ngang ô nhập, nên
           thứ đập vào mắt trước lại là hai thứ 95% người dùng không bao giờ đụng tới. */
        .composer {
            background: var(--surface);
            padding: .2rem clamp(.8rem, 4vw, 2rem) .9rem;
        }
        .composer .inner { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: .45rem; }
        .composer .send-row {
            display: flex; gap: .5rem; align-items: flex-end;
            background: var(--surface); border: 1px solid var(--rule-strong);
            border-radius: var(--radius-lg); padding: .35rem .4rem .35rem .9rem;
            box-shadow: var(--shadow);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .composer .send-row:focus-within { border-color: var(--accent); }
        .composer .send-row textarea {
            border: none; background: transparent; box-shadow: none !important; padding: .45rem 0;
            font-size: .98rem;
        }
        .composer textarea { flex: 1; min-height: 2.6rem; max-height: 10rem; resize: none; }
        .composer #send { border-radius: var(--radius-pill); }

        /* Hàng tuỳ chọn: chữ nhỏ, không viền, nằm ngang cùng dòng gợi ý. */
        .composer .controls {
            display: flex; gap: .8rem; flex-wrap: wrap; align-items: center;
            font-size: .78rem; color: var(--faint);
        }
        .composer .controls .opt { display: flex; align-items: center; gap: .3rem; }
        .composer .controls select {
            width: auto; font-size: .78rem; padding: .12rem 1.1rem .12rem .35rem;
            border-color: transparent; background-color: transparent; color: var(--muted);
            border-radius: var(--radius-pill);
        }
        .composer .controls select:hover { border-color: var(--rule-strong); background-color: var(--surface-2); }
        .composer .controls label.inline { font-size: .78rem; color: var(--faint); }
        .composer .controls .grow { flex: 1; }
        .hint { font-size: .78rem; color: var(--faint); }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="dot"></span> Trợ lý tài liệu <small>RAG</small></div>
    <nav>
        <a href="/" class="active">Hỏi đáp</a>
        <a href="/admin.html">Quản trị</a>
    </nav>
    <div class="spacer"></div>
    <span class="chip" id="pipeline-chip" title="Model đang dùng để trả lời">—</span>
    <button class="ghost tiny" id="theme-toggle">Tối</button>
    <button class="ghost tiny" onclick="promptForKey()">API key</button>
</div>

<div class="shell">
    <aside>
        <div class="head">
            <span>Hội thoại</span>
            <button class="tiny" onclick="newConversation()">+ Mới</button>
        </div>
        <div id="conv-list"><div class="empty">Chưa có hội thoại nào.</div></div>
    </aside>

    <main>
        <div id="messages"></div>

        <div class="composer">
            <div class="inner">
                <div class="send-row">
                    <textarea id="input" rows="1" placeholder="Nhập câu hỏi… (Enter để gửi, Shift+Enter để xuống dòng)"></textarea>
                    <button class="primary" id="send">Gửi</button>
                </div>
                <div class="controls">
                    <span class="hint grow" id="hint">Câu trả lời luôn kèm nguồn để bạn kiểm chứng.</span>
                    <span class="opt">
                        <label for="provider" style="display:inline;margin:0">Model</label>
                        <select id="provider" title="Model dùng để trả lời câu hỏi này">
                            <option value="">mặc định hệ thống</option>
                        </select>
                    </span>
                    <span class="opt">
                        <label for="category" style="display:inline;margin:0">Nhóm tài liệu</label>
                        <select id="category" title="Chỉ tìm trong một nhóm tài liệu">
                            <option value="">tất cả</option>
                        </select>
                    </span>
                    <label class="inline" title="Tắt để buộc hệ thống tính lại, không lấy từ cache">
                        <input type="checkbox" id="use-cache" checked> Dùng cache
                    </label>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="toasts"></div>

<script src="/app.js"></script>
<script>
    let conversationId = null;
    let busy = false;
    let models = [];

    /* ------------------------------------------------------------ Khoi tao */

    async function boot() {
        try {
            const [settings, cats, convs] = await Promise.all([
                api('/api/v1/rag/settings'),
                api('/api/v1/rag/admin/categories').catch(() => ({ categories: [] })),
                api('/api/v1/rag/conversations?limit=40').catch(() => ({ conversations: [] }))
            ]);
            document.getElementById('pipeline-chip').textContent =
                settings.provider + ' / ' + settings.model;

            const catalog = await api('/api/v1/rag/models');
            models = catalog.providers || [];
            const sel = document.getElementById('provider');
            models.filter(p => p.available).forEach(p => {
                const group = document.createElement('optgroup');
                group.label = p.provider;
                p.models.forEach(m => {
                    const o = document.createElement('option');
                    o.value = p.provider + '|' + m;
                    o.textContent = m;
                    group.appendChild(o);
                });
                sel.appendChild(group);
            });
            if (!models.some(p => p.available)) {
                toast('Chưa có provider nào được cấu hình API key — hãy đặt biến môi trường trước khi hỏi.', 'warn');
            }

            const catSel = document.getElementById('category');
            (cats.categories || []).forEach(c => {
                const o = document.createElement('option');
                o.value = c; o.textContent = c;
                catSel.appendChild(o);
            });

            renderConversations(convs.conversations || []);
        } catch (e) {
            console.warn('boot', e);
        } finally {
            // Dựng SAU khi nạp xong nhóm tài liệu để gợi ý bám theo kho thật; chạy trong
            // finally để lỗi mạng lúc khởi động không để lại một khung chat trống trơn.
            showWelcome();
            openFromHash();
        }
    }

    /**
     * Mở thẳng một hội thoại từ địa chỉ: {@code /#c=<id>}.
     *
     * Để người dùng gửi được đường dẫn tới đúng câu trả lời cho đồng nghiệp — trước đây
     * chỉ có cách bảo nhau "vào trang rồi tự tìm trong danh sách bên trái".
     */
    function openFromHash() {
        const id = (location.hash || '').startsWith('#c=')
            ? decodeURIComponent(location.hash.substring(3)) : '';
        if (id) openConversation(id).catch(() => toast('Không mở được hội thoại này.', 'warn'));
    }

    window.addEventListener('hashchange', openFromHash);

    /* -------------------------------------------------------- Hoi thoai */

    function renderConversations(list) {
        const host = document.getElementById('conv-list');
        if (!list.length) {
            host.innerHTML = '<div class="empty">Chưa có hội thoại nào.</div>';
            return;
        }
        host.innerHTML = '';
        list.forEach(c => {
            const el = document.createElement('div');
            el.className = 'conv' + (c.id === conversationId ? ' active' : '');
            el.innerHTML = '<b>' + escapeHtml(c.title || '(chưa có tiêu đề)') + '</b>'
                + '<small>' + c.messageCount + ' tin nhắn · ' + fmtDate(c.lastActiveAt) + '</small>';
            el.onclick = () => openConversation(c.id);
            host.appendChild(el);
        });
    }

    async function openConversation(id) {
        const data = await api('/api/v1/rag/conversations/' + encodeURIComponent(id));
        conversationId = id;
        if (location.hash !== '#c=' + id) location.hash = 'c=' + id;
        const host = document.getElementById('messages');
        host.innerHTML = '';
        (data.messages || []).forEach(m => {
            if (m.role === 'user') {
                appendUser(m.content);
            } else {
                const el = appendBot();
                el.classList.toggle('abstained', !!m.abstained);
                el.querySelector('.bubble').innerHTML = renderMarkdown(m.content);
                renderCitations(el, m.citations || []);
                renderMeta(el, {
                    messageId: m.id, provider: m.provider, model: m.model,
                    usage: { inputTokens: m.inputTokens, outputTokens: m.outputTokens, costUsd: m.costUsd },
                    latencyMs: m.latencyMs, cacheHit: m.cacheHit, abstained: m.abstained
                });
            }
        });
        api('/api/v1/rag/conversations?limit=40').then(r => renderConversations(r.conversations || []));
        host.scrollTop = host.scrollHeight;
    }

    function newConversation() {
        conversationId = null;
        // Bỏ #c=... khỏi địa chỉ, nếu không tải lại trang sẽ nhảy về hội thoại cũ.
        history.replaceState(null, '', location.pathname);
        showWelcome();
        api('/api/v1/rag/conversations?limit=40').then(r => renderConversations(r.conversations || []));
    }

    /* --------------------------------------------------------- Màn hình chào */

    /**
     * Gợi ý mặc định. Cố tình là câu hỏi ĐẦY ĐỦ chứ không phải từ khoá: người dùng bấm
     * vào là gửi được ngay, và họ học luôn cách hỏi mà hệ thống trả lời tốt nhất.
     */
    const DEFAULT_SUGGESTIONS = [
        'Nghỉ phép hằng năm được bao nhiêu ngày?',
        'Quy trình xin nghỉ phép gồm những bước nào?',
        'Chi phí công tác được thanh toán thế nào?',
        'Nội quy về giờ làm việc quy định ra sao?'
    ];

    function showWelcome() {
        const host = document.getElementById('messages');
        host.innerHTML = '';
        const el = document.createElement('div');
        el.id = 'welcome';
        el.innerHTML =
            '<div class="mark">✦</div>'
            + '<h1>Bạn cần tra cứu điều gì?</h1>'
            + '<p class="lede">Hỏi bằng tiếng Việt tự nhiên. Tôi tìm trong tài liệu nội bộ đã được nạp '
            + 'và trả lời kèm trích dẫn để bạn kiểm chứng.</p>'
            + '<div class="promises">'
            + '<span>Luôn kèm nguồn</span>'
            + '<span>Không có tài liệu thì nói thẳng, không đoán</span>'
            + '<span>Câu hỏi chung chung sẽ được hỏi lại</span>'
            + '</div>'
            + '<p class="suggest-label">Thử một câu hỏi</p>'
            + '<div class="suggests"></div>';

        const box = el.querySelector('.suggests');
        suggestions().forEach(q => {
            const b = document.createElement('button');
            b.innerHTML = '<i>→</i><span></span>';
            b.querySelector('span').textContent = q;
            b.onclick = () => {
                document.getElementById('input').value = q;
                send();
            };
            box.appendChild(b);
        });
        host.appendChild(el);
    }

    /**
     * Luôn trả về ĐỦ 4 gợi ý: hai câu bám theo nhóm tài liệu thật (nếu có) rồi bù bằng
     * câu mẫu. Không lấy toàn bộ theo nhóm — kho mới nạp thường chỉ có một nhóm, và một
     * ô gợi ý lẻ loi giữa màn hình còn khó coi hơn là không có gợi ý nào.
     */
    function suggestions() {
        const cats = Array.from(document.getElementById('category').options)
            .filter(o => o.value)
            .map(o => o.value);
        const fromCats = cats.slice(0, 2).map(c => 'Tài liệu nhóm "' + c + '" quy định những gì?');
        return [...fromCats, ...DEFAULT_SUGGESTIONS].slice(0, 4);
    }

    function clearWelcome() {
        const el = document.getElementById('welcome');
        if (el) el.remove();
    }

    /* ---------------------------------------------------------- Render */

    function appendUser(text) {
        const host = document.getElementById('messages');
        clearWelcome();
        const el = document.createElement('div');
        el.className = 'msg user';
        el.innerHTML = '<div class="avatar">B</div><div class="content">'
            + '<div class="bubble">'
            + escapeHtml(text).replace(/\n/g, '<br>') + '</div></div>';
        host.appendChild(el);
        host.scrollTop = host.scrollHeight;
        return el;
    }

    function appendBot() {
        const host = document.getElementById('messages');
        clearWelcome();
        const el = document.createElement('div');
        el.className = 'msg bot';
        el.innerHTML = '<div class="avatar">✦</div><div class="content">'
            + '<div class="bubble"></div></div>';
        host.appendChild(el);
        host.scrollTop = host.scrollHeight;
        return el;
    }

    function setStatus(el, text) {
        let line = el.querySelector('.status-line');
        if (!line) {
            line = document.createElement('div');
            line.className = 'status-line';
            el.querySelector('.bubble').appendChild(line);
        }
        line.innerHTML = '<span class="spinner"></span><span></span>';
        line.querySelector('span:last-child').textContent = text;
    }

    function clearStatus(el) {
        const line = el.querySelector('.status-line');
        if (line) line.remove();
    }

    function renderCitations(el, citations) {
        el.querySelectorAll('.cites').forEach(n => n.remove());
        if (!citations || !citations.length) return;
        const box = document.createElement('div');
        box.className = 'cites';
        const row = document.createElement('div');
        row.className = 'pill-row';
        box.innerHTML = '<div class="label">Nguồn tham khảo (' + citations.length + ')</div>';
        citations.forEach(c => {
            const d = document.createElement('details');
            d.className = 'cite';
            d.innerHTML =
                '<summary><span class="num">' + c.rank + '</span>'
                + '<span class="name">' + escapeHtml(c.fileName) + '</span>'
                + '<span class="chip mono" title="Điểm liên quan">' + fmtScore(c.score) + '</span>'
                + '<span class="arrow">▸</span></summary>'
                + (c.headingPath ? '<div class="path">' + escapeHtml(c.headingPath) + '</div>' : '')
                + '<div class="snippet">' + escapeHtml(c.snippet) + '</div>';
            row.appendChild(d);
        });
        box.appendChild(row);
        el.querySelector('.bubble').after(box);
    }

    function renderMeta(el, info) {
        el.querySelectorAll('.meta').forEach(n => n.remove());
        const meta = document.createElement('div');
        meta.className = 'meta';

        const chips = [];
        if (info.cacheHit) {
            chips.push('<span class="chip good" title="Trả lời lấy từ cache nên rất nhanh và không tốn tiền">cache ' + info.cacheHit.toLowerCase() + '</span>');
        }
        if (info.abstained && info.abstainReason === 'CLARIFICATION_NEEDED') {
            chips.push('<span class="chip accent" title="Câu hỏi còn chung chung, trợ lý đang hỏi lại cho rõ">hỏi lại</span>');
        } else if (info.abstained) {
            chips.push('<span class="chip ochre" title="Hệ thống chủ động không trả lời vì tài liệu không đủ liên quan">không đủ căn cứ</span>');
        }
        if (info.provider) chips.push('<span class="chip">' + escapeHtml(info.provider) + '/' + escapeHtml(info.model || '') + '</span>');
        if (info.latencyMs) chips.push('<span class="chip mono">' + fmtMs(info.latencyMs) + '</span>');
        const u = info.usage || {};
        if (u.inputTokens || u.outputTokens) {
            chips.push('<span class="chip mono" title="token vào / ra">'
                + fmtInt(u.inputTokens || 0) + '→' + fmtInt(u.outputTokens || 0) + ' tok</span>');
        }
        if (u.costUsd) chips.push('<span class="chip ochre mono" title="Chi phí ước tính">' + fmtMoney(u.costUsd) + '</span>');
        meta.innerHTML = chips.join('');

        if (info.messageId) {
            const vote = document.createElement('div');
            vote.className = 'vote';
            vote.innerHTML = '<button class="tiny ghost" title="Câu trả lời hữu ích">👍</button>'
                + '<button class="tiny ghost" title="Câu trả lời sai hoặc không hữu ích">👎</button>';
            const [up, down] = vote.querySelectorAll('button');
            up.onclick = () => sendFeedback(info.messageId, 1, vote);
            down.onclick = () => {
                const comment = prompt('Câu trả lời sai ở đâu? (không bắt buộc)') || null;
                sendFeedback(info.messageId, -1, vote, comment);
            };
            meta.appendChild(vote);
        }
        el.querySelector('.content').appendChild(meta);
    }

    async function sendFeedback(messageId, rating, host, comment) {
        try {
            await api('/api/v1/rag/feedback', {
                method: 'POST',
                body: JSON.stringify({ messageId, conversationId, rating, comment: comment || null })
            });
            host.innerHTML = '<span class="chip good">đã ghi nhận</span>';
        } catch (e) { /* toast da hien */ }
    }

    /* ------------------------------------------------------------ Gui */

    async function send() {
        if (busy) return;
        const input = document.getElementById('input');
        const question = input.value.trim();
        if (!question) return;

        busy = true;
        document.getElementById('send').disabled = true;
        input.value = '';
        input.style.height = 'auto';
        appendUser(question);

        const bot = appendBot();
        setStatus(bot, 'Đang chuẩn bị…');

        const sel = document.getElementById('provider').value;
        const [provider, model] = sel ? sel.split('|') : [null, null];
        const payload = {
            question,
            provider, model,
            conversationId,
            category: document.getElementById('category').value || null,
            useCache: document.getElementById('use-cache').checked
        };

        let answer = '';
        try {
            const response = await fetch('/api/v1/rag/chat/stream', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });
            if (response.status === 401) { promptForKey(); throw new Error('401'); }
            if (!response.ok) throw new Error('HTTP ' + response.status);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // SSE: cac frame cach nhau boi dong trong
                let split;
                while ((split = buffer.indexOf('\n\n')) >= 0) {
                    const frame = buffer.slice(0, split);
                    buffer = buffer.slice(split + 2);
                    handleFrame(frame);
                }
            }
        } catch (e) {
            clearStatus(bot);
            if (!answer) {
                bot.querySelector('.bubble').innerHTML =
                    '<p class="muted">Không nhận được câu trả lời. ' + escapeHtml(e.message) + '</p>';
            }
        } finally {
            busy = false;
            document.getElementById('send').disabled = false;
            input.focus();
        }

        function handleFrame(frame) {
            let event = 'message';
            const dataLines = [];
            frame.split('\n').forEach(line => {
                if (line.startsWith('event:')) event = line.slice(6).trim();
                else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
            });
            if (!dataLines.length) return;
            let data;
            try { data = JSON.parse(dataLines.join('\n')); } catch (e) { return; }

            if (event === 'status') {
                setStatus(bot, data.detail || data.stage);
            } else if (event === 'citations') {
                renderCitations(bot, data);
            } else if (event === 'token') {
                clearStatus(bot);
                answer += data.t;
                bot.querySelector('.bubble').innerHTML = renderMarkdown(answer);
                document.getElementById('messages').scrollTop = 1e9;
            } else if (event === 'done') {
                clearStatus(bot);
                conversationId = data.conversationId || conversationId;
                const clarifying = data.abstained && data.abstainReason === 'CLARIFICATION_NEEDED';
                bot.classList.toggle('clarifying', clarifying);
                bot.classList.toggle('abstained', !!data.abstained && !clarifying);
                if (data.answer) bot.querySelector('.bubble').innerHTML = renderMarkdown(data.answer);
                renderCitations(bot, data.citations || []);
                renderMeta(bot, data);
                if (data.debug) {
                    const d = data.debug;
                    document.getElementById('hint').textContent =
                        'Lần hỏi vừa rồi: ' + d.queryVariants + ' biến thể truy vấn · '
                        + d.vectorHits + ' kết quả vector · ' + d.fulltextHits + ' full-text · '
                        + d.candidates + ' ứng viên → ' + d.selected + ' đoạn được chọn'
                        + (d.reranker ? ' (rerank ' + d.reranker
                            + (d.rerankReliable ? '' : ', KHÔNG đáng tin') + ')' : '');
                }
                api('/api/v1/rag/conversations?limit=40')
                    .then(r => renderConversations(r.conversations || []));
            } else if (event === 'error') {
                clearStatus(bot);
                bot.querySelector('.bubble').innerHTML =
                    '<p class="muted">' + escapeHtml(data.error) + '</p>';
            }
        }
    }

    /* ---------------------------------------------------------- Su kien */

    document.getElementById('send').onclick = send;
    const input = document.getElementById('input');
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    boot();
</script>
</body>
