# Build and run the full test suite, including the Testcontainers *IT classes.
# GitHub runners have Docker, so those run for real here even when a developer
# machine skipped them locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + test
        run: ./mvnw -B clean verify

      - name: Bao cao ket qua test
        if: always()
        run: |
          echo "### Ket qua test" >> $GITHUB_STEP_SUMMARY
          if ls target/surefire-reports/*.txt > /dev/null 2>&1; then
            grep -h "Tests run" target/surefire-reports/*.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "(khong co bao cao)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Luu bao cao khi that bai
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Kiem tra Dockerfile build duoc
        run: docker build -t aiagent:ci .
